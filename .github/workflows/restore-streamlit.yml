name: Restore Streamlit file

on:
  workflow_dispatch:
  push:
    paths:
      - streamlit_app.py

permissions:
  contents: write

jobs:
  restore:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Restore previous Streamlit source
        run: |
          git checkout HEAD^ -- streamlit_app.py
          python - <<'PY'
          from pathlib import Path
          p = Path('streamlit_app.py')
          s = p.read_text()
          if 'from datetime import date, datetime' not in s:
              s = s.replace('from datetime import date\n', 'from datetime import date, datetime\n', 1)
          p.write_text(s)
          PY
          python -m py_compile streamlit_app.py
      - name: Commit restored source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add streamlit_app.py
          git commit -m 'fix: restore complete Streamlit application [skip ci]'
          git push
