name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-asyncio hypothesis httpx

      - name: Compile application
        run: |
          python -m py_compile streamlit_app.py
          python -m py_compile frontend/streamlit_app.py
          python -m compileall -q backend

      - name: Lint backend
        run: |
          python -m flake8 backend/ --max-line-length=120 --ignore=E501,W503,E221,E241,E302,E305,W293

      - name: Run production regression suite
        env:
          SUPABASE_URL: ""
          SUPABASE_KEY: ""
          SUPABASE_ANON_KEY: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
          TWILIO_ACCOUNT_SID: ""
          TWILIO_AUTH_TOKEN: ""
          TWILIO_FROM_NUMBER: ""
          GMAIL_SENDER_EMAIL: ""
          GMAIL_APP_PASSWORD: ""
        run: |
          pytest tests/ -v --tb=short --ignore=tests/test_bugfix_sms_exploration.py

      - name: FastAPI startup and health smoke test
        env:
          SUPABASE_URL: ""
          SUPABASE_KEY: ""
          SUPABASE_ANON_KEY: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
        run: |
          timeout 20s uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.request

          url = "http://127.0.0.1:8000/health"
          last_error = None
          for _ in range(15):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      body = json.loads(response.read())
                      assert response.status == 200
                      assert body["status"] == "ok"
                      assert body["database"]["status"] == "ok"
                      print("FastAPI health smoke test passed")
                      raise SystemExit(0)
              except Exception as exc:
                  last_error = exc
              time.sleep(1)
          raise SystemExit(f"FastAPI did not become healthy: {last_error}")
          PY

      - name: Streamlit startup smoke test
        run: |
          timeout 20s streamlit run streamlit_app.py \
            --server.headless true \
            --server.port 8501 \
            --server.address 127.0.0.1 \
            --server.enableCORS false \
            --server.enableXsrfProtection false &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8501/"
          last_error = None
          for _ in range(15):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          print("Streamlit smoke test passed")
                          raise SystemExit(0)
              except Exception as exc:
                  last_error = exc
              time.sleep(1)
          raise SystemExit(f"Streamlit did not become ready: {last_error}")
          PY

      - name: Deployment configuration check
        run: |
          test -f requirements.txt
          test -f supabase/migrations/20240101_init.sql
          test -f .streamlit/config.toml || true
