name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-asyncio hypothesis

      - name: Compile application
        run: |
          python -m py_compile streamlit_app.py
          python -m py_compile frontend/streamlit_app.py
          python -m compileall -q backend

      - name: Lint backend
        run: |
          python -m flake8 backend/ --max-line-length=120 --ignore=E501,W503,E221,E241,E302,E305,W293

      - name: Run regression tests
        env:
          SUPABASE_URL: ""
          SUPABASE_KEY: ""
          SUPABASE_ANON_KEY: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
          TWILIO_ACCOUNT_SID: ""
          TWILIO_AUTH_TOKEN: ""
          TWILIO_FROM_NUMBER: ""
          GMAIL_SENDER_EMAIL: ""
          GMAIL_APP_PASSWORD: ""
        run: |
          # The SMS exploration file documents pre-fix bug discoveries and
          # explicitly contains tests that were designed to fail on the old
          # implementation. It is not part of the regression suite.
          pytest tests/ -v --tb=short --ignore=tests/test_bugfix_sms_exploration.py

      - name: Streamlit smoke test
        run: |
          timeout 20s streamlit run streamlit_app.py \
            --server.headless true \
            --server.port 8501 \
            --server.address 127.0.0.1 \
            --server.enableCORS false \
            --server.enableXsrfProtection false &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8501/"
          last_error = None
          for _ in range(15):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          print("Streamlit smoke test passed")
                          raise SystemExit(0)
              except Exception as exc:
                  last_error = exc
              time.sleep(1)
          raise SystemExit(f"Streamlit did not become ready: {last_error}")
          PY

      - name: Deploy to Streamlit Cloud
        if: github.ref == 'refs/heads/main'
        env:
          STREAMLIT_TOKEN: ${{ secrets.STREAMLIT_TOKEN }}
        run: |
          if [ -z "$STREAMLIT_TOKEN" ]; then
            echo "STREAMLIT_TOKEN not set, skipping deployment."
            exit 0
          fi
          pip install streamlit
          streamlit deploy --token "$STREAMLIT_TOKEN" --repo "${{ github.repository }}" --branch main --file streamlit_app.py
