name: Restore Streamlit now

on:
  push:

permissions:
  contents: write

jobs:
  restore:
    if: !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore known-good Streamlit source
        run: |
          git fetch origin 9b2b1a65cdf97a4c5e1d764e0b3700fab9ccaeef --depth=1
          git checkout 9b2b1a65cdf97a4c5e1d764e0b3700fab9ccaeef -- streamlit_app.py
          python - <<'PY'
          from pathlib import Path
          p = Path('streamlit_app.py')
          s = p.read_text()
          s = s.replace('from datetime import date\n', 'from datetime import date, datetime\n', 1)
          p.write_text(s)
          PY
          python -m py_compile streamlit_app.py
      - name: Commit source and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/restore-now.yml .github/workflows/restore-streamlit.yml 2>/dev/null || true
          git add streamlit_app.py
          git commit -m 'fix: restore complete Streamlit application [skip ci]'
          git push
